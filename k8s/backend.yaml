apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: prospect-analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: your-registry/pre-sales-agent-api:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_SERVER
          value: "postgres"
        - name: REDIS_HOST
          value: "redis"
        - name: ENVIRONMENT
          value: "production"
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: prospect-analyzer
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: prospect-analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: your-registry/pre-sales-agent-celery:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_SERVER
          value: "postgres"
        - name: REDIS_HOST
          value: "redis"
        - name: ENVIRONMENT
          value: "production"
